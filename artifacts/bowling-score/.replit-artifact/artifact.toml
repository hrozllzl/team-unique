kind = "web"
previewPath = "/"
title = "팀 유니크"
version = "1.0.0"
id = "artifacts/bowling-score"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23930

[services.development]
run = "pnpm --filter @workspace/bowling-score run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bowling-score", "run", "build" ]
publicDir = "artifacts/bowling-score/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23930"
BASE_PATH = "/"
